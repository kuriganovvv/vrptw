server:
  port: 8080
spring:
  application:
    name: vrptw-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vrptw}
    username: ${SPRING_DATASOURCE_USERNAME:vrptw}
    password: ${SPRING_DATASOURCE_PASSWORD:vrptw}
    driver-class-name: org.postgresql.Driver
vrptw:
  storage:
    mode: ${VRPTW_STORAGE_MODE:postgres}
  seed:
    enabled: ${VRPTW_SEED_ENABLED:true}
    force: ${VRPTW_SEED_FORCE:false}
  data-dir: ${VRPTW_DATA_DIR:}
timefold:
  solver:
    termination:
      spent-limit: 30s  
dispatch:
  team: "С-42"          
  version: "0.1.0"
  pgp:
    min-orders: 3       
    window-minutes: 120
  restock:
    enabled: true
