server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Матрица времени в пути приходит большим JSON (по ТЗ — до 100 МБ)
    client_max_body_size 100m;

    # API уходит на backend внутри compose-сети: фронт обращается к относительному /api/v1
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Построение плана по ТЗ занимает до 300 с — прокси не должен рвать соединение
        proxy_connect_timeout 10s;
        proxy_send_timeout 330s;
        proxy_read_timeout 330s;
        proxy_buffering off;
    }

    # SPA: любой путь отдаёт index.html, дальше роутинг на клиенте
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
