<router-outlet />

<!-- Toast -->
@if (store.toast(); as toast) {
  <div
    class="toast-in fixed bottom-20 right-4 z-50 flex max-w-sm items-center gap-2 rounded-xl px-4 py-3 text-sm shadow-xl md:bottom-5 md:right-5"
    [class.bg-slate-900]="toast.tone !== 'warning'"
    [class.text-white]="toast.tone !== 'warning'"
    [class.bg-amber-50]="toast.tone === 'warning'"
    [class.text-amber-900]="toast.tone === 'warning'"
    [class.border]="toast.tone === 'warning'"
    [class.border-amber-200]="toast.tone === 'warning'"
    role="status"
    aria-live="polite"
  >
    <app-icon
      [name]="toast.tone === 'warning' ? 'triangle-alert' : 'check-circle-2'"
      class="size-4 shrink-0"
      [class.text-amber-500]="toast.tone === 'warning'"
      [class.text-emerald-400]="toast.tone !== 'warning'"
    />
    <span class="min-w-0">{{ toast.text }}</span>
    <button
      type="button"
      (click)="store.dismissToast()"
      class="ml-1 rounded p-0.5 opacity-60 transition-opacity hover:opacity-100"
      aria-label="Закрыть уведомление"
    >
      <app-icon name="x" class="size-3.5" />
    </button>
  </div>
}
