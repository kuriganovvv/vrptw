services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: rostelecom-backend
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx2g -Xms512m
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rostelecom-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy